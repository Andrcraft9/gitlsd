set log = "git" "log" "--oneline" "--decorate" "--color=always"
set batch-size = 100
set log-split-ratio = 1:1
set show-split-ratio = 1:2
set status-split-ratio = 1:2
set preview = "git" "show" "--stat" "--color=always"
set show-commit = "git" "show" "--no-patch" "--color=always"
set show = "git" "show" "--patch" "--format=" "--color=always"
set status-diff = "git" "diff" "--color=always"
set diff-filter = delta --paging never --line-numbers --light
set editor = code -g --goto file:line
bind / = search
bind : = command
bind ? = help
bind N = search-previous
bind R = status-revert
bind d = show-mode
bind e = open-editor
bind j = move-down
bind k = move-up
bind n = search-next
bind p = toggle-preview
bind q = back
bind r = refresh
bind s = status-mode
bind u = status-toggle-stage
bind { = previous-file
bind } = next-file
bind up = move-up
bind down = move-down
bind shift-up = previous-chunk
bind shift-down = next-chunk
bind page-up = page-up
bind page-down = page-down
bind home = scroll-start
bind end = scroll-end
bind left = scroll-left
bind right = scroll-right
bind esc = back
bind tab = status-switch-group
bind ctrl-c = quit
