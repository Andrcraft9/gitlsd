# Git command used to load history.
set log = log

# Number of commits loaded per batch.
set batch-size = 100

# Navigation.
bind j move-down
bind down move-down
bind k move-up
bind up move-up
bind page-down page-down
bind page-up page-up

# Search and commands.
bind / search
bind n search-next
bind N search-previous
bind : command
bind ? help
bind esc back

# Exit.
bind q quit
bind ctrl-c quit
