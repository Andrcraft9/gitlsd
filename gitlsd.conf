# Git command used to load history.
set log = git log --color=always --format='%C(auto)%h%Creset %C(auto)%d%Creset %C(yellow)%ad%Creset %C(blue)%an%Creset %s' --date=short

# Number of commits loaded per batch.
set batch-size = 100

# Log/explorer to preview/diff ratios for each mode.
set log-split-ratio = 1:1
set show-split-ratio = 1:2
set status-split-ratio = 1:2

# Selected-commit preview.
set preview = git show --stat --patch --color=always

# Full-screen selected-commit show mode.
set show-commit = git show --no-patch --color=always
set show = git show --patch --format= --color=always
set status-diff = git diff --color=always

# Optional presentation filter; requires delta on PATH. Empty disables it.
set diff-filter = delta --paging never --line-numbers

# Editor command. Use `code -g --goto file:line` for VS Code.
#set editor = micro +line file
set editor = code -g --goto file:line

# Navigation.
bind j move-down
bind down move-down
bind k move-up
bind up move-up
bind page-down page-down
bind page-up page-up
bind d show-mode
bind s status-mode
bind tab status-switch-group
bind u status-toggle-stage
bind e open-editor

# Search and commands.
bind / search
bind n search-next
bind N search-previous
bind : command
bind ? help
bind esc back

# Preview.
bind p toggle-preview

# Exit.
bind ctrl-c quit
